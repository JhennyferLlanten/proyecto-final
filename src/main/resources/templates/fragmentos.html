<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fragmentos</title>
    <style th:fragment="estilos">
        body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f7f7f5; color: #1f1f1e; line-height: 1.5; }
        nav { background: #ffffff; border-bottom: 1px solid #e3e3df; padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
        nav b { margin-right: 16px; }
        nav a { padding: 4px 12px; border-radius: 6px; color: #5f5e5a; text-decoration: none; }
        nav a:hover { background: #f1efe8; }
        nav a.activo { background: #e6f1fb; color: #185fa5; }
        main { max-width: 1100px; margin: 24px auto; padding: 20px; background: #ffffff; border: 1px solid #e3e3df; border-radius: 12px; }
        h1 { font-size: 24px; margin: 0 0 4px; }
        h2 { font-size: 18px; margin: 28px 0 8px; }
        p { color: #5f5e5a; margin: 0 0 12px; }
        a { color: #185fa5; }
        table { border-collapse: collapse; width: 100%; font-size: 14px; }
        th { text-align: left; font-weight: 500; color: #5f5e5a; background: #f7f7f5; padding: 6px 8px; border-bottom: 1px solid #b4b2a9; }
        td { padding: 6px 8px; border-bottom: 1px solid #e3e3df; }
        th.n, td.n { text-align: right; font-variant-numeric: tabular-nums; }
        td.mejor-k { background: #e6f1fb; font-weight: 500; }
        .aviso { background: #eaf3de; color: #3b6d11; border: 1px solid #97c459; border-radius: 8px; padding: 10px 14px; margin: 16px 0; }
        .nota { font-size: 13px; margin-top: 8px; }
        .fila-enlace { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #e3e3df; }
        .boton-sec { display: inline-block; padding: 6px 12px; border: 1px solid #b4b2a9; border-radius: 8px; color: #1f1f1e; text-decoration: none; font-size: 14px; white-space: nowrap; }
        .boton-sec:hover { background: #f1efe8; }
        .selector { display: inline-flex; flex-wrap: wrap; border: 1px solid #b4b2a9; border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
        .selector a { padding: 6px 14px; color: #5f5e5a; text-decoration: none; border-right: 1px solid #e3e3df; }
        .selector a:last-child { border-right: none; }
        .selector a:hover { background: #f1efe8; }
        .selector a.activo { background: #e6f1fb; color: #185fa5; font-weight: 500; }
        .metricas { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 8px; }
        .metrica { background: #f7f7f5; border-radius: 8px; padding: 8px 12px; }
        .metrica small { display: block; color: #5f5e5a; }
        .metrica b { font-size: 20px; font-weight: 500; }
        .grupo { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid #e3e3df; }
        .punto { width: 10px; height: 10px; border-radius: 50%; flex: none; }
        .figuras { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .figura { border: 1px solid #e3e3df; border-radius: 8px; padding: 10px; }
        .figura p { font-weight: 500; margin: 0 0 6px; color: #1f1f1e; }
        .figura svg { width: 100%; height: auto; display: block; }
        @media (max-width: 800px) { .figuras { grid-template-columns: minmax(0, 1fr); } }
        .tabla { overflow-x: auto; }
        .buscador { display: flex; gap: 8px; max-width: 520px; }
        .buscador input { flex: 1; }
        .etiqueta { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: #eaf3de; color: #3b6d11; }
        td.mejor { background: #eaf3de; color: #3b6d11; font-weight: 500; }
        input[type=text] { padding: 7px 10px; border: 1px solid #b4b2a9; border-radius: 8px; font-size: 14px; }
        button { padding: 7px 14px; border: 0; border-radius: 8px; background: #2c2c2a; color: #ffffff; font-size: 14px; cursor: pointer; }
        button:hover { background: #444441; }
    </style>
</head>
<body>
<nav th:fragment="barra(activa)">
    <b>Análisis de algoritmos</b>
    <a href="/" th:classappend="${activa == 'inicio'} ? 'activo'">Inicio</a>
    <a href="/similitud" th:classappend="${activa == 'similitud'} ? 'activo'">Similitud</a>
    <a href="/clustering" th:classappend="${activa == 'clustering'} ? 'activo'">Clustering</a>
    <a href="/patrones" th:classappend="${activa == 'patrones'} ? 'activo'">Patrones</a>
</nav>
</body>
</html>
