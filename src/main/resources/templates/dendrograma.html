<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dendrograma</title>
    <style th:replace="~{fragmentos :: estilos}"></style>
</head>
<body>
<nav th:replace="~{fragmentos :: barra('clustering')}"></nav>
<main>
<p><a class="boton-sec" href="/clustering">← Volver a clustering</a></p>
<h1 th:text="'Dendrograma de ' + ${criterio.nombre}"></h1>
<p>Cada abstract es una hoja. Cada línea horizontal une dos grupos a la distancia a la que se unieron. La línea roja es el corte con el mejor número de grupos de este criterio.</p>

<div class="selector">
    <a th:each="opcion, estado : ${criterios}" th:href="@{/clustering/dendrograma/{posicion}(posicion=${estado.index})}"
       th:classappend="${estado.index == posicion} ? 'activo'" th:text="${opcion.nombre}"></a>
</div>

<div class="metricas">
    <div class="metrica"><small>Grupos del corte</small><b th:text="${criterio.mejorGrupos}"></b></div>
    <div class="metrica"><small>Silueta</small><b th:text="${#numbers.formatDecimal(criterio.mejorSilueta, 1, 4)}"></b></div>
</div>

<h2>Grupos del corte</h2>
<div class="grupo" th:each="grupo, estado : ${criterio.gruposMejorCorte}">
    <span class="punto" th:style="'background:' + ${colores[estado.index]}"></span>
    <b th:text="'Grupo ' + ${estado.count} + ':'"></b>
    <span th:text="${grupo}"></span>
</div>

<h2>Dendrograma</h2>
<div class="figuras">
    <div class="figura">
        <p>Escala de 0 a 1</p>
        <div th:utext="${figuraCompleta}"></div>
    </div>
    <div class="figura">
        <p th:text="'Escala ampliada de ' + ${#numbers.formatDecimal(minimoAmpliado, 1, 2)} + ' a 1,00'"></p>
        <div th:utext="${figuraAmpliada}"></div>
    </div>
</div>
</main>
</body>
</html>
